# ==============================================================================
# n8n (event ETL) + Postgres + Traefik (automatic HTTPS via Let's Encrypt).
# ------------------------------------------------------------------------------
# This is the NON-audio path: it receives voice-events + recording webhooks and
# fans them out to Supabase / Telegram. Runs on the same VPS as the agent.
#
#   1. Point an A record  n8n.your-vps.example → <your-vps-ip>
#   2. Fill in the placeholders below (copy to a .env next to this file, or edit inline).
#   3. docker compose -f docker-compose.n8n.yml up -d
#   4. Open https://n8n.your-vps.example and import workflow.voice-events.json
# ==============================================================================

services:
  # --- Reverse proxy + TLS ----------------------------------------------------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect all plain HTTP to HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # --- Let's Encrypt certificate resolver (named "le") ---
      # Traefik solves the ACME HTTP-01 challenge on :80 and stores certs in the
      # mounted acme.json. Referenced by the n8n router label further down.
      - --certificatesresolvers.le.acme.email=YOUR_LETSENCRYPT_EMAIL
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  # --- Database ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: YOUR_DB_USER
      POSTGRES_PASSWORD: YOUR_DB_PASSWORD
      POSTGRES_DB: n8n
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U YOUR_DB_USER -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- n8n --------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Login for the n8n editor UI. Change these before exposing publicly.
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: YOUR_N8N_USER
      N8N_BASIC_AUTH_PASSWORD: YOUR_N8N_PASSWORD
      # Public URL — webhooks are registered under this, so it MUST be the real
      # HTTPS host or Vobiz callbacks will point at the wrong place.
      WEBHOOK_URL: https://n8n.your-vps.example
      N8N_HOST: n8n.your-vps.example
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      # Persist to Postgres instead of the default SQLite.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: YOUR_DB_USER
      DB_POSTGRESDB_PASSWORD: YOUR_DB_PASSWORD
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.your-vps.example`)
      - traefik.http.routers.n8n.entrypoints=websecure
      # Use the "le" cert resolver defined on the traefik service above.
      - traefik.http.routers.n8n.tls.certresolver=le
      - traefik.http.services.n8n.loadbalancer.server.port=5678

volumes:
  n8n_data:
  n8n_pgdata:
  traefik_letsencrypt:
